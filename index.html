    <script>

        const main = async () => {
        const url_params = new URLSearchParams(document.location.search)
        const responce = await fetch ("data/greetings.json")
        const data =  await responce.json()
        console.log(data)
        const all_langs = data.all_langs
        document.getElementById("langnav").innerHTML=
            all_langs.map (x => `<a href="?lang=${x}">${x}/a>`).join(" ")
        let lang = url_params.get("lang")
        if(!lang || !all_langs.includes(lang)){
            lang = "en"
        }
        const tervehdys = data.messages[lang]
        document.documentElement.lang = lang
        const heading_elem = document.getElementById("otsikko")
        const data_display_elem = document.getElementById("data_display")
        data_display.innerText = JSON.stringify(data, null, 2)
        heading_elem.innerHTML = tervehdys
        console.log("hei maailma")
